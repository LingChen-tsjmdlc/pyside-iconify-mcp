name: CI

# Runs on every branch push and pull request. The release workflow (publish.yml)
# also calls this file (workflow_call), so a failing test blocks a release.
#
# To make "main only accepts code that passes the tests" actually true, require the
# "All tests passed" check in the repository settings (Settings -> Rules, or Branches ->
# branch protection rule for main -> "Require status checks to pass before merging").
# A workflow file cannot enforce that by itself.
on:
    push:
        branches: ["**"]
    pull_request:
    workflow_call:

jobs:
    test:
        name: macOS Python ${{ matrix.python-version }}
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  enable-cache: true
            - name: Install Python
              run: uv python install ${{ matrix.python-version }}
            - name: Sync locked dependencies
              run: uv sync --python ${{ matrix.python-version }} --group test
            - name: Run tests
              run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

    # One stable check name for branch protection, so the matrix can change later
    # without editing the repository settings.
    all-tests-passed:
        name: All tests passed
        if: always()
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Fail unless every test job succeeded
              run: |
                  echo "test result: ${{ needs.test.result }}"
                  test "${{ needs.test.result }}" = "success"
