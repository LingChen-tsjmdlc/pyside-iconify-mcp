[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "pyside-iconify-mcp"
dynamic = ["version"]
description = "An MCP server that helps AI assistants write correct pyside-iconify code."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jerrylu" }]
keywords = ["mcp", "fastmcp", "pyside", "pyside6", "pyqt", "iconify", "icons"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# FastMCP 官方建议生产环境固定版本（小版本里可能有破坏性变更）；
# 这里折中：只放行 4.1.x 的补丁版本，升 4.2 时由维护者验证后手动改。
# pyside-iconify 不带任何 extra，所以不会安装 Qt。上限必须保留：本项目读取它的
# __init__.pyi 与 core 层内部模块，新的次版本需要验证后再放行。
# 注意：`uv add` 会重写本段并丢掉上限与注释，改依赖请直接编辑本文件。
dependencies = [
    "fastmcp>=4.1.4,<4.2",
    "pydantic>=2.12",
    "pyside-iconify>=1.2,<1.3",
]

[project.scripts]
pyside-iconify-mcp = "pyside_iconify_mcp.server:main"

[project.urls]
Homepage = "https://github.com/LingChen-tsjmdlc/pyside-iconify-mcp"
Source = "https://github.com/LingChen-tsjmdlc/pyside-iconify-mcp"
Issues = "https://github.com/LingChen-tsjmdlc/pyside-iconify-mcp/issues"

[tool.hatch.version]
path = "src/pyside_iconify_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyside_iconify_mcp"]
exclude = ["**/.gitkeep", "**/__pycache__/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pyside_iconify_mcp",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["**/.gitkeep", "**/__pycache__/**"]

[dependency-groups]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
